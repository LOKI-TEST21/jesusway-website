<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Jesus Way Christian Church</title>

    <!-- CONNECT CSS -->
    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- MAIN LOGIN PAGE -->

    <div class="login-page" id="loginPage">


        <!-- =====================
             LAMP
        ====================== -->

        <div class="lamp-container">


            <!-- LAMP WIRE -->

            <div class="lamp-wire"></div>


            <!-- LAMP -->

            <div class="lamp">

                <!-- LIGHT BULB -->

                <div class="lamp-light"></div>

            </div>


            <!-- =====================
                 PULL CHAIN
            ====================== -->

            <div class="pull-chain-container">


                <!-- CHAIN -->

                <div
                    class="pull-chain"
                    id="pullChain">
                </div>


                <!-- HANDLE -->

                <div
                    class="pull-handle"
                    id="pullHandle">
                </div>


            </div>


        </div>


        <!-- =====================
             INSTRUCTION
        ====================== -->

        <p
            class="instruction"
            id="instruction">

            Pull the chain downward to turn on the light 💡

        </p>


        <!-- =====================
             LOGIN BOX
        ====================== -->

        <div
            class="login-box"
            id="loginBox">


            <h1>Welcome</h1>

            <p>Jesus Way Christian Church</p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- USERNAME -->

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >


                <!-- PASSWORD -->

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <button type="submit">

                    LOGIN

                </button>


                <!-- ERROR MESSAGE -->

                <p id="errorMessage"></p>


            </form>


        </div>


    </div>


    <!-- CONNECT JAVASCRIPT -->

    <script src="login.js"></script>


</body>

</html>
